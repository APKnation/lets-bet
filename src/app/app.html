<!-- 3D Background Scene (fixed, behind everything) -->
<app-background-3d></app-background-3d>

<div class="min-h-screen bg-transparent text-slate-100 flex flex-col relative z-10">
  <!-- Header with Logo and Auth Triggers -->
  <app-header (loginClick)="toggleAuthModal()" (registerClick)="toggleAuthModal()"></app-header>

  <!-- Auth Modal -->
  @if (isAuthModalOpen()) {
    <app-auth-modal (closeModal)="toggleAuthModal()"></app-auth-modal>
  }

  <!-- Main Content -->
  <main class="flex-grow container mx-auto px-4 py-8 space-y-12">
    
    <!-- Hero Section: Top Teams & VIP WhatsApp CTA -->
    <app-hero></app-hero>

    <!-- VIP Room: Win Rate & New Tips -->
    <app-vip-room></app-vip-room>

    <!-- Betting Platforms: Sportbet, Melbet, etc. -->
    <app-betting-platforms></app-betting-platforms>

    <!-- Payments: M-Pesa, Halotel, Airtel, Halopesa -->
    <app-payments></app-payments>

    <!-- Services: What you get -->
    <app-services></app-services>

  </main>

  <!-- Footer: Contact & Links -->
  <app-footer></app-footer>
</div>
