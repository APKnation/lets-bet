<section class="glass-panel p-6 lg:p-12 relative">
  <div class="text-center mb-10">
    <h2 class="text-3xl font-bold text-white mb-2">Instant Payments</h2>
    <p class="text-slate-400">Fast, secure deposits and withdrawals via local mobile money networks.</p>
  </div>

  <div class="max-w-4xl mx-auto flex flex-col md:flex-row gap-8">
    
    <!-- Payment Methods List -->
    <div class="md:w-1/2 flex flex-col justify-center gap-4">
      @for (method of paymentMethods; track method.name) {
        <div class="flex items-center gap-4 p-4 rounded-xl border border-slate-700 bg-slate-800/50 hover:bg-slate-700/50 transition-colors">
          <div class="w-12 h-12 rounded-full flex items-center justify-center shadow-lg {{ method.color }}">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
            </svg>
          </div>
          <div>
            <h4 class="text-lg font-bold text-white">{{ method.name }}</h4>
            <p class="text-xs text-emerald-400">0% Transaction Fee</p>
          </div>
        </div>
      }
    </div>

    <!-- Payment Form -->
    <div class="md:w-1/2 bg-slate-900 rounded-2xl p-6 border border-slate-700 shadow-2xl relative overflow-hidden">
      <!-- Decor -->
      <div class="absolute -top-10 -right-10 w-32 h-32 bg-emerald-500/10 rounded-full blur-2xl"></div>
      
      <!-- Tabs -->
      <div class="flex p-1 bg-slate-800 rounded-lg mb-6">
        <button (click)="setTransactionType('deposit')" 
                [class.bg-emerald-500]="transactionType() === 'deposit'" 
                [class.text-white]="transactionType() === 'deposit'"
                [class.text-slate-400]="transactionType() !== 'deposit'"
                class="flex-1 py-2 rounded-md font-semibold transition-all">Deposit</button>
        <button (click)="setTransactionType('withdraw')" 
                [class.bg-emerald-500]="transactionType() === 'withdraw'" 
                [class.text-white]="transactionType() === 'withdraw'"
                [class.text-slate-400]="transactionType() !== 'withdraw'"
                class="flex-1 py-2 rounded-md font-semibold transition-all">Withdraw</button>
      </div>

      <form class="space-y-5 relative z-10">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Mobile Number</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">+255</span>
            <input type="text" class="w-full pl-16 pr-4 py-3 bg-slate-800 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white font-medium" placeholder="7XX XXX XXX">
          </div>
        </div>
        
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Amount (TZS)</label>
          <input type="number" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white font-medium" placeholder="10,000">
        </div>

        <button type="button" class="w-full py-4 rounded-xl font-bold text-lg text-white bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 transition-all shadow-lg shadow-emerald-500/25 transform hover:-translate-y-0.5">
          @if (transactionType() === 'deposit') { Deposit Now } @else { Request Withdrawal }
        </button>
      </form>
    </div>

  </div>
</section>
