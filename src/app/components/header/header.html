<header class="sticky top-0 z-50 glass-panel border-b-0 rounded-none border-b border-slate-700 shadow-md">
  <div class="container mx-auto px-4 py-4 flex justify-between items-center">
    <div class="flex items-center gap-2">
      <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-400 to-blue-500 flex items-center justify-center font-bold text-white shadow-lg">
        LB
      </div>
      <h1 class="text-2xl font-bold tracking-tight text-white">Lets<span class="text-emerald-400">Bet</span></h1>
    </div>
    <div class="flex gap-4">
      <button (click)="loginClick.emit()" class="px-4 py-2 text-slate-300 hover:text-white transition-colors font-medium">Login</button>
      <button (click)="registerClick.emit()" class="btn-primary">Create Account</button>
    </div>
  </div>
</header>
