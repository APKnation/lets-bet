<header class="sticky top-0 z-50 glass-panel border-b-0 rounded-none border-b border-slate-700 shadow-md">
  <div class="container mx-auto px-4 py-3 md:py-4 flex flex-wrap md:flex-nowrap justify-between items-center gap-y-3">
    
    <!-- Brand -->
    <div class="flex items-center gap-2 w-full md:w-auto justify-center md:justify-start">
      <div class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-gradient-to-tr from-emerald-400 to-blue-500 flex items-center justify-center font-bold text-white shadow-lg text-xs md:text-base shrink-0">
        EA
      </div>
      <h1 class="text-lg md:text-2xl font-bold tracking-tight text-white truncate">Enico & <span class="text-emerald-400">APKNation</span></h1>
    </div>

    <!-- Auth Buttons -->
    <div class="flex gap-3 w-full md:w-auto justify-stretch md:justify-end">
      <button (click)="loginClick.emit()" class="flex-1 md:flex-none px-4 py-2 text-slate-300 hover:text-white transition-colors font-medium bg-slate-800 md:bg-transparent rounded-lg border border-slate-700 md:border-transparent text-sm md:text-base text-center">
        Login
      </button>
      <button (click)="registerClick.emit()" class="flex-1 md:flex-none btn-primary px-4 py-2 text-sm md:text-base whitespace-nowrap text-center">
        Create Account
      </button>
    </div>

  </div>
</header>
