<div class="fixed inset-0 z-[100] flex items-center justify-center bg-slate-900/80 backdrop-blur-sm p-4">
  <div class="glass-panel w-full max-w-md p-8 relative animate-in fade-in zoom-in duration-300">
    <button (click)="closeModal.emit()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
    
    <h2 class="text-3xl font-bold mb-6 text-center text-white">
      @if (isLogin()) { Welcome Back } @else { Create Account }
    </h2>

    <form class="space-y-4">
      @if (!isLogin()) {
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">Full Name</label>
          <input type="text" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white" placeholder="ENTER YOUR FULL NAME">
        </div>
      }
      
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Email or Phone</label>
        <input type="text" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white" placeholder="ENTER YOUR EMAIL OR PHONE NUMBER">
      </div>
      
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
        <input type="password" class="w-full px-4 py-3 bg-slate-800 border border-slate-600 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 text-white" placeholder="••••••••">
      </div>

      <button type="button" class="w-full btn-primary py-3 mt-2">
        @if (isLogin()) { Login } @else { Register }
      </button>
    </form>
    
    <div class="mt-6 text-center text-slate-400">
      @if (isLogin()) {
        Don't have an account? 
        <button (click)="toggleMode()" class="text-emerald-400 hover:text-emerald-300 font-medium ml-1">Sign Up</button>
      } @else {
        Already have an account? 
        <button (click)="toggleMode()" class="text-emerald-400 hover:text-emerald-300 font-medium ml-1">Login</button>
      }
    </div>
  </div>
</div>
